name = "localflow-licensing"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Licenses issued by the webhook are stored here so a customer can fetch their
# key again from the success page without a second payment.
[[kv_namespaces]]
binding = "LICENSES"
id = "e37a0da0854342118fffbb7a5b9cd6c0"

[vars]
# The exact origins allowed to call the checkout endpoint. Anything else is
# refused, so the endpoint cannot be embedded on someone else's page.
ALLOWED_ORIGINS = "https://therealone00.github.io"
PRICE_EUR_CENTS = "1500"
PRODUCT_NAME = "LocalFlow Pro"
SUCCESS_URL = "https://therealone00.github.io/LocalFlow/success.html"
CANCEL_URL = "https://therealone00.github.io/LocalFlow/#pricing"

# Secrets — set with `wrangler secret put`, never in this file:
#   STRIPE_SECRET_KEY       sk_live_… / sk_test_…
#   STRIPE_WEBHOOK_SECRET   whsec_…
#   LICENSE_SIGNING_KEY     base64 of the raw 32-byte Ed25519 private key
